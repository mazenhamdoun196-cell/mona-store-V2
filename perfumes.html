<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumes - Mona Store</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* المتغيرات للوضع الفاتح */
        :root {
            --header-bg: #3b1d3b;
            --bg-color: #fdf8f8;
            --card-bg: #ffffff;
            --text-color: #222;
            --gold: #c5a880;
            --shadow: 0 8px 25px rgba(0,0,0,0.08);
            --btn-arrow: #3b1d3b;
        }

        /* المتغيرات للوضع الداكن */
        body.dark-mode {
            --header-bg: #1a0f1a;
            --bg-color: #120a12;
            --card-bg: #2a1a2a;
            --text-color: #f1f1f1;
            --gold: #d4af37;
            --shadow: 0 8px 25px rgba(0,0,0,0.5);
            --btn-arrow: #d4af37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: var(--text-color); transition: 0.3s; }

        /* --- الهيدر الجديد --- */
        header {
            background: var(--header-bg); color: #fff; 
            padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .header-icons { display: flex; align-items: center; gap: 15px; font-size: 22px; }
        .header-icons a, .header-icons button { color: #fff; background: none; border: none; cursor: pointer; }

        /* --- عنوان الصفحة --- */
        .page-title {
            text-align: center; margin: 30px 0 20px 0;
        }
        .page-title h2 { 
            font-family: 'Alex Brush', cursive; /* الخط الفخم */
            font-size: 55px; 
            color: var(--header-bg); 
            line-height: 1;
            font-weight: normal;
        }
        body.dark-mode .page-title h2 { color: var(--gold); }
        .page-title p { font-size: 14px; color: #777; margin-top: 10px; letter-spacing: 1px; }

        /* --- كروت الأقسام (صور) --- */
        .categories-container {
            max-width: 800px; margin: 0 auto 40px auto; padding: 0 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .category-card {
            display: block; position: relative;
            border-radius: 20px; overflow: hidden;
            box-shadow: var(--shadow); transition: transform 0.3s;
            text-decoration: none; color: #fff;
            height: 220px; 
        }
        .category-card:hover { transform: translateY(-5px); }

        .category-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .category-card:hover img { transform: scale(1.05); }

        /* طبقة شفافة فوق الصورة عشان النص يبان */
        .category-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 30px 20px 20px 20px;
            display: flex; flex-direction: column; justify-content: flex-end;
        }

        .category-overlay h3 { font-size: 26px; margin-bottom: 5px; font-weight: 700; }
        .category-overlay p { font-size: 14px; opacity: 0.9; }

    </style>
</head>
<body>

    <header>

        <!-- زرار الدارك مود (نص) -->
        <div class="header-icons">
            <button class="theme-btn" id="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>

        <!-- زرار البيت (يمين) -->
        <div class="header-icons">
            <a href="index.html"><i class="fa-solid fa-house"></i></a>
        </div>
    </header>

    <div class="page-title">
        <h2>Perfumes</h2>
        <p>اكتشف مجموعتنا الفاخرة من العطور</p>
    </div>

    <div class="categories-container">
        
        <!-- قسم العطور الرجالي -->
        <a href="men.html" class="category-card">
            <img src="men.jpg" alt="Men Perfumes">
            <div class="category-overlay">
                <h3>عطور رجالي</h3>
                <p>أناقة لا مثيل لها</p>
            </div>
        </a>

        <!-- قسم العطور الحريمي -->
        <a href="women.html" class="category-card">
            <img src="women.jpg" alt="Women Perfumes">
            <div class="category-overlay">
                <h3>عطور حريمي</h3>
                <p>سحر وجاذبية</p>
            </div>
        </a>

        <!-- قسم البدي سبلاش -->
        <a href="body-splash.html" class="category-card">
            <img src="splash.jpg" alt="Body Splash">
            <div class="category-overlay">
                <h3>بدي سبلاش</h3>
                <p>انتعاش يدوم طوال اليوم</p>
            </div>
        </a>

    </div>

    <script>
        // الوضع الداكن
        const themeBtn = document.getElementById('theme-btn');
        const isDark = localStorage.getItem('theme') === 'dark';
        
        if (isDark) {
            document.body.classList.add('dark-mode');
            themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const darkModeOn = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', darkModeOn ? 'dark' : 'light');
            themeBtn.innerHTML = darkModeOn ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
    </script>
</body>
</html>
