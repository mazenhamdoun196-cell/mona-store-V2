<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Store - Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #c5a880;
            --primary-dark: #b0926a;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text: #2b2d42;
            --text-muted: #8d99ae;
            --border: #eae5df;
            --input-bg: #f7f6f2;
            --danger: #d90429;
            --success: #2b9348;
        }

        body.dark-mode {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #f8f9fa;
            --text-muted: #888;
            --border: #2a2a2a;
            --input-bg: #222;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; transition: 0.3s; }

        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #fdfbf7 0%, #f4ece2 100%); }
        body.dark-mode #login-screen { background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); }
        .login-card { background: var(--card-bg); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; position: relative; border: 1px solid var(--border); }
        .login-card h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--text); margin: 0 0 10px 0; letter-spacing: 1px; }
        .login-card h1 span { color: var(--primary); }
        .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; padding: 14px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); }
        .input-group i.toggle-pass { position: absolute; right: 15px; top: 40px; cursor: pointer; color: var(--text-muted); }
        .login-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .login-btn:hover { background: var(--primary-dark); }
        #login-error { color: var(--danger); font-size: 13px; margin-top: 15px; font-weight: 600; }
        .theme-btn-login { position: absolute; top: 20px; right: 20px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #main-app { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .header-title { text-align: left; }
        .header-title h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin: 0; color: var(--text); }
        .header-title h1 span { color: var(--primary); }
        .header-title p { margin: 5px 0 0 0; font-size: 12px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        .theme-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }

        .search-box { position: relative; margin-bottom: 25px; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 15px; outline: none; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
        .filter-btn { padding: 10px 15px; border-radius: 30px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        .btn-update { display: block; width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--success); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        .btn-update:hover { background: #207237; }

        .dept-card { background: var(--card-bg); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .dept-title { font-size: 16px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--text); }

        .product-row { display: flex; flex-direction: column; gap: 10px; background: var(--input-bg); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .row-top { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .row-top input { width: 100%; }
        .row-bottom { display: flex; gap: 10px; width: 100%; align-items: center; }
        .input-price { flex: 1; width: 50%; } 
        .input-qty { flex: 1; width: 50%; }   
        .product-row input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 600; outline: none; }

        .image-upload-wrapper { display: flex; align-items: center; gap: 15px; width: 100%; }
        .btn-upload { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-upload:hover { background: var(--input-bg); }
        .btn-upload input[type="file"] { display: none; }
        .image-preview { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; cursor: pointer; transition: transform 0.2s; }
        .image-preview:hover { transform: scale(1.1); }
        
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; }

        .btn-del { background: rgba(217, 4, 41, 0.1); border: 1px solid rgba(217, 4, 41, 0.2); color: var(--danger); padding: 12px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-del:hover { background: var(--danger); color: #fff; }

        .btn-add { width: 100%; padding: 12px; border-radius: 8px; border: 1px dashed var(--primary); background: transparent; color: var(--primary); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-add:hover { background: rgba(197, 168, 128, 0.05); }
        .logout-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--card-bg); color: var(--danger); border: 1px solid var(--danger); font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        @media(min-width: 600px) {
            .row-top { flex-direction: row; align-items: center; }
            .row-top input { flex: 1; }
            .row-bottom { width: 100%; }
            .input-price { width: 120px; flex: none; }
            .input-qty { width: 80px; flex: none; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <button class="theme-btn-login" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        <div class="login-card">
            <h1>Mona <span>Store</span></h1>
            <p>Welcome Back, Admin</p>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="admin@mona.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
                <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword()"></i>
            </div>
            <button class="login-btn" onclick="doLogin()">Sign In</button>
            <p id="login-error"></p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <div class="header-title">
                <h1>Mona <span>Store</span></h1>
                <p>Control Panel</p>
            </div>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search products by name...">
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="men-perfumes">Men's Perfumes</button>
            <button class="filter-btn" data-filter="women-perfumes">Women's Perfumes</button>
            <button class="filter-btn" data-filter="body-splash">Body Splash</button>
            <button class="filter-btn" data-filter="skin-care">Skin Care</button>
            <button class="filter-btn" data-filter="hair-care">Hair Care</button>
            <button class="filter-btn" data-filter="korean-prod">Korean</button>
        </div>

        <button id="update-btn" class="btn-update">Update Changes</button>
        <div id="departments-container"></div>
        <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img src="" id="lightbox-img">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBreocaDHdzeqAlWGCb0CORcLpX3hbtR0A",
            authDomain: "mona-store-v2.firebaseapp.com",
            projectId: "mona-store-v2",
            storageBucket: "mona-store-v2.firebasestorage.app",
            messagingSenderId: "805351875315",
            appId: "1:805351875315:web:88129bea715f5bbc404d86",
            databaseURL: "https://mona-store-v2-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const isDark = localStorage.getItem('theme') === 'dark';
        if (isDark) {
            document.body.classList.add('dark-mode');
            updateThemeIcons(true);
        }

        window.toggleTheme = function() {
            document.body.classList.toggle('dark-mode');
            const darkModeOn = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', darkModeOn ? 'dark' : 'light');
            updateThemeIcons(darkModeOn);
        };

        function updateThemeIcons(isDark) {
            document.querySelectorAll('.theme-btn, .theme-btn-login').forEach(btn => {
                btn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            });
        }

        window.togglePassword = function() {
            const passInput = document.getElementById('login-password');
            const icon = document.querySelector('.toggle-pass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        window.openLightbox = function(src) {
            if (!src) return;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox').style.display = 'none';
        };

        setPersistence(auth, browserLocalPersistence).catch((error) => console.error(error));

        window.doLogin = function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            errorMsg.innerText = "Authenticating...";
            errorMsg.style.color = "var(--primary)";
            
            signInWithEmailAndPassword(auth, email, password)
                .catch(error => {
                    errorMsg.style.color = "var(--danger)";
                    errorMsg.innerText = "Invalid email or password.";
                });
        };

        window.doLogout = function() { signOut(auth); };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
                document.getElementById('login-error').innerText = "";
            }
        });

        let dbProducts = { "men-perfumes": {}, "women-perfumes": {}, "body-splash": {}, "skin-care": {}, "hair-care": {}, "korean-prod": {} };
        let currentFilter = 'all';

        function loadData() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    dbProducts = {
                        "men-perfumes": data["men-perfumes"] || {},
                        "women-perfumes": data["women-perfumes"] || {},
                        "body-splash": data["body-splash"] || {},
                        "skin-care": data["skin-care"] || {},
                        "hair-care": data["hair-care"] || {},
                        "korean-prod": data["korean-prod"] || {}
                    };
                } else {
                    dbProducts = { "men-perfumes": {}, "women-perfumes": {}, "body-splash": {}, "skin-care": {}, "hair-care": {}, "korean-prod": {} };
                }
                renderAllSections();
            });
        }

        function renderAllSections() {
            const container = document.getElementById('departments-container');
            container.innerHTML = '';

            const categories = {
                "men-perfumes": "Men's Perfumes",
                "women-perfumes": "Women's Perfumes",
                "body-splash": "Body Splash",
                "skin-care": "Skin Care",
                "hair-care": "Hair Care",
                "korean-prod": "Korean Products"
            };

            for (let catKey in categories) {
                if (currentFilter !== 'all' && currentFilter !== catKey) continue;

                const section = document.createElement('div');
                section.className = 'dept-card';
                section.innerHTML = `<div class="dept-title">${categories[catKey]}</div>`;
                
                const list = document.createElement('div');
                list.className = 'product-list';
                list.id = `list-${catKey}`;

                const items = dbProducts[catKey];
                let hasItems = false;
                
                for (let id in items) {
                    hasItems = true;
                    createProductRow(list, catKey, id, items[id]);
                }

                if (!hasItems) {
                    list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; margin: 10px 0;">No products here yet.</p>';
                }

                section.appendChild(list);

                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add';
                addBtn.innerText = '+ Add Product';
                addBtn.onclick = () => addNewProductRow(catKey);
                section.appendChild(addBtn);

                container.appendChild(section);
            }
        }

        function createProductRow(container, category, id, data = {}) {
            const row = document.createElement('div');
            row.className = 'product-row';
            row.id = `row-${category}-${id}`;
            row.dataset.category = category;
            row.dataset.id = id;

            // هنا بنعرض الصورة لو كان فيه داتا (بريفيو أو رابط)
            const displayImg = data.image || '';

            // لو الكمية صفر هنعرضها صفر
            const qtyValue = (data.qty !== undefined && data.qty !== null) ? data.qty : '';

            row.innerHTML = `
                <div class="row-top">
                    <input type="text" class="input-name" value="${data.name || ''}" placeholder="Product Name">
                    <div class="image-upload-wrapper">
                        <input type="hidden" class="input-image" value="${displayImg}">
                        <img src="${displayImg}" class="image-preview" style="${displayImg ? 'display:block' : ''}" onclick="openLightbox(this.src)">
                        <label class="btn-upload">
                            <i class="fa-solid fa-camera"></i> Choose Image
                            <input type="file" accept="image/*" onchange="handleImageSelect(this)">
                        </label>
                    </div>
                </div>
                <div class="row-bottom">
                    <input type="number" class="input-price" value="${data.price || ''}" placeholder="Price">
                    <input type="number" class="input-qty" value="${qtyValue}" placeholder="Qty">
                    <button class="btn-del" onclick="removeProductRow(this)"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            container.appendChild(row);
        }

        // تحويل الصورة لـ Base64 عشان تتحفظ في فايربيس وتفضل موجودة
        window.handleImageSelect = function(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result;
                
                const row = inputElement.closest('.product-row');
                const preview = row.querySelector('.image-preview');
                const hiddenInput = row.querySelector('.input-image');

                preview.src = base64String;
                preview.style.display = 'block';
                hiddenInput.value = base64String; // بنخزن الصورة كاملة
            };
            reader.readAsDataURL(file);
        };

        window.addNewProductRow = function(category) {
            const tempId = 'new-' + Date.now();
            const section = document.getElementById(`list-${category}`);
            if (section.querySelector('p')) section.innerHTML = '';
            createProductRow(section, category, tempId);
        };

        // دالة الحذف
        window.removeProductRow = function(button) {
            const row = button.closest('.product-row');
            const category = row.dataset.category;
            const id = row.dataset.id;

            if (id.startsWith('new-')) {
                row.remove();
            } else {
                if (confirm('Are you sure you want to delete this product? This will also remove the image.')) {
                    // هنا بنمسح المنتج من فايربيس (وده هيمسح الصورة لأنها جواه)
                    // لما نعمل الـ API هنضيف كود يمسح الصورة من GitHub كمان
                    set(ref(db, `products/${category}/${id}`), null);
                }
            }
        };

        document.getElementById('update-btn').addEventListener('click', () => {
            const allRows = document.querySelectorAll('.product-row');
            let validationError = false;
            let updates = {};

            allRows.forEach(row => {
                const category = row.dataset.category;
                const id = row.dataset.id;

                const name = row.querySelector('.input-name').value.trim();
                const image = row.querySelector('.input-image').value.trim();
                const price = row.querySelector('.input-price').value.trim();
                let qty = row.querySelector('.input-qty').value.trim();

                if (qty === '') qty = '0'; 

                if (name || price || qty || image) {
                    if (!name || !price) {
                        validationError = true;
                        row.style.border = '1px solid var(--danger)';
                    } else {
                        row.style.border = 'none';
                        
                        let finalId = id;
                        if (id.startsWith('new-')) {
                            const newRef = push(ref(db, `products/${category}`));
                            finalId = newRef.key;
                        }

                        updates[`products/${category}/${finalId}`] = {
                            name: name,
                            image: image, // هنا هيخزن الـ Base64
                            price: parseFloat(price),
                            qty: parseInt(qty)
                        };
                    }
                }
            });

            if (validationError) {
                alert("Please fill Name and Price for all products.");
                return;
            }

            for (let path in updates) {
                set(ref(db, path), updates[path]);
            }

            alert("Data updated successfully!");
            loadData(); 
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.product-row').forEach(row => {
                const name = row.querySelector('.input-name').value.toLowerCase();
                row.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderAllSections();
            });
        });
    </script>
</body>
</html>
